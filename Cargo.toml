[package]
name = "grpc_service"
version = "0.1.0"
edition = "2024"

[dependencies]
tonic = "0.13"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-stream = { version = "0.1", features = ["sync", "net"] }
async-stream = "0.3"


[build-dependencies]
tonic-build = "0.13"
